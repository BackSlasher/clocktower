<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Clocktower</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/phone/phone.css">
</head>
<body>
<div id="app">

  <!-- Connecting splash -->
  <section id="s-splash" class="screen center" hidden>
    <div class="gear spin big">&#9881;</div>
    <p class="dim">Winding up&hellip;</p>
  </section>

  <!-- Join -->
  <section id="s-join" class="screen center" hidden>
    <div class="brand"><h1 class="display logo">Clock<span>tower</span></h1>
    <p class="dim tagline">Keep the Great Clock ticking.</p></div>
    <form id="joinForm" class="plate join" autocomplete="off">
      <div id="joinMsg" class="msg" hidden></div>
      <label>Room code
        <input id="fCode" class="code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="4" placeholder="ABCD" required>
      </label>
      <label>Your name
        <input id="fName" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="12" placeholder="Engineer" required>
      </label>
      <button class="btn go" id="fGo" type="submit">Join the town</button>
    </form>
  </section>

  <!-- Lobby -->
  <section id="s-lobby" class="screen" hidden>
    <div class="lobby-head">
      <div class="dim small">You're in</div>
      <div class="me-chip"><i id="lobbyDot" class="dot"></i><span id="lobbyName" class="display"></span></div>
      <div class="dim small">Room <b id="lobbyRoom" class="mono"></b></div>
    </div>
    <ul id="lobbyList" class="plate plist"></ul>
    <div class="lobby-foot">
      <button id="startBtn" class="btn big-btn" hidden>Start the game</button>
      <p id="waitMsg" class="dim center-text" hidden></p>
      <button id="leaveBtn" class="link">Leave room</button>
    </div>
  </section>

  <!-- Game -->
  <section id="s-game" class="screen game" hidden>
    <header id="topbar" class="plate">
      <div class="stat" title="Cogs"><span class="ico cog">&#9881;</span><b id="tPurse">0</b></div>
      <div class="stat" title="Lives"><span class="ico heart">&#9829;</span><b id="tLives">0</b></div>
      <div class="stat wave"><small>Wave</small><b id="tWave">0/0</b></div>
      <div class="stat wave timer" id="tTimerBox"><small>Build</small><b id="tTimer">0</b></div>
    </header>
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="under"></div>
    </div>
    <div id="actions">
      <button id="giftBtn" class="btn sm">Gift cogs</button>
      <button id="readyBtn" class="btn sm" hidden>Ready</button>
      <button id="zoomBtn" class="btn sm ghost">Zoom</button>
    </div>
    <div id="rotate" class="rotate"><span>Rotate your phone for a bigger map</span><button id="rotateX" aria-label="Dismiss">&times;</button></div>
    <div id="panel" class="plate"></div>
  </section>

  <!-- End -->
  <section id="s-end" class="screen end" hidden>
    <h1 id="endTitle" class="display"></h1>
    <p id="endSub" class="dim center-text"></p>
    <div id="endMine" class="plate mine"></div>
    <div id="endAwards" class="awards"></div>
    <div class="lobby-foot">
      <button id="againBtn" class="btn big-btn" hidden>Play again</button>
      <p id="againWait" class="dim center-text" hidden></p>
    </div>
  </section>

  <!-- Gift sheet -->
  <div id="giftSheet" class="sheet" hidden>
    <div class="sheet-body plate">
      <div class="sheet-head"><b class="display">Send cogs</b><button id="giftClose" class="x" aria-label="Close">&times;</button></div>
      <div id="giftPlayers" class="chips"></div>
      <div id="giftAmts" class="chips amts"></div>
      <button id="giftSend" class="btn big-btn" disabled>Send</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="banner" class="banner" hidden>Connection lost &mdash; reconnecting&hellip;</div>

  <!-- Replaced -->
  <div id="replaced" class="overlay" hidden>
    <div class="plate ovl-body">
      <h2 class="display">Opened in another tab</h2>
      <p class="dim">This engineer is now at the controls somewhere else.</p>
      <button id="takeBtn" class="btn big-btn">Take back control</button>
    </div>
  </div>
</div>
<script type="module" src="/phone/app.js"></script>
</body>
</html>
